# Direct dependencies of the zero-shot-ssr env, pinned to the tested versions.
#   conda env create -f environment.yml
# The torch wheels are built for CUDA 12.1, pick another index for a different CUDA.
name: zero-shot-ssr
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1+cu121
      - torchaudio==2.5.1+cu121
      - coqui-tts==0.27.5
      - transformers==4.57.6
      - librosa==0.11.0
      - scipy==1.17.1
      - numpy==2.4.6
      - python_speech_features==0.6
      - tqdm==4.68.3
      - matplotlib==3.11.0
      - wespeaker @ git+https://github.com/wenet-e2e/wespeaker.git@d2846b26c5979f52bc269906779b8c99ee1be0ce
      - soundfile==0.14.0
      - onnxruntime==1.27.0
      - einops==0.8.2
      - openai-whisper==20250625
      - gdown==6.1.0
